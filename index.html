<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="max-w-5xl mx-auto p-6">
    
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Inventory Dashboard</h1>
      <button class="bg-blue-500 text-white px-4 py-2 rounded">+ Add Item</button>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded shadow">
        <p>Total Items</p>
        <h2 class="text-2xl font-bold">24</h2>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <p>Low Stock</p>
        <h2 class="text-2xl font-bold text-red-500">5</h2>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <p>Locations</p>
        <h2 class="text-2xl font-bold">3</h2>
      </div>
    </div>

    <div class="bg-white rounded shadow">
      <table class="w-full">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-3 text-left">Item</th>
            <th class="p-3 text-left">Qty</th>
            <th class="p-3 text-left">Location</th>
            <th class="p-3 text-left">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-t">
            <td class="p-3">Keyboard</td>
            <td class="p-3">10</td>
            <td class="p-3">Warehouse A</td>
            <td class="p-3 text-green-500">In Stock</td>
          </tr>
          <tr class="border-t">
            <td class="p-3">Mouse</td>
            <td class="p-3">2</td>
            <td class="p-3">Warehouse B</td>
            <td class="p-3 text-red-500">Low</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
